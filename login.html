<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartLocalServices</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #101827;
            color: #F5F3EE;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 340px;
            max-width: 90%;
            padding: 30px;
            background: #1b2638;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        h2 {
            color: #D9A441;
            text-align: center;
            margin-top: 0;
        }

        input, button {
            box-sizing: border-box;
            width: 100%;
            padding: 12px;
            margin-top: 14px;
            border-radius: 6px;
            font-size: 15px;
        }

        input {
            border: 1px solid #777;
            background: #f7f7f7;
            color: #101827;
        }

        button {
            border: none;
            background: #D9A441;
            color: #101827;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #e6b350;
        }

        #message {
            overflow-wrap: anywhere;
            text-align: center;
            min-height: 20px;
            margin-top: 15px;
            font-size: 14px;
        }

        a {
            color: #D9A441;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .links {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }
    </style>
</head>

<body>
    <div class="login-box">
        <h2>🏡 SmartLocalServices</h2>
        <h3 style="text-align:center; color:#ccc; font-weight:normal; margin-top: -10px;">Welcome Back</h3>

        <form id="loginForm">
            <input
                type="email"
                id="email"
                placeholder="Email Address"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required>

            <button type="submit" id="loginButton">Login</button>
        </form>

        <p id="message" role="status"></p>

        <div class="links">
            <p>
                New user?
                <a href="register.html">Register here</a>
            </p>
            <p><a href="index.html">Back to Home</a></p>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://sublime-delight-production-2c90.up.railway.app';
        const loginForm = document.getElementById('loginForm');

        loginForm.addEventListener('submit', async function(event) {
            event.preventDefault();

            const message = document.getElementById('message');
            const button = document.getElementById('loginButton');

            message.textContent = 'Checking your details...';
            message.style.color = '#F5F3EE';
            button.disabled = true;

            try {
                const response = await fetch(BACKEND_URL + '/users/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    credentials: 'include',
                    body: JSON.stringify({
                        email: document.getElementById('email').value.trim(),
                        password: document.getElementById('password').value
                    })
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || 'Login failed. Check your details.'
                    );
                }

                // Save user details to localStorage for reliable client-side state
                localStorage.setItem('currentUser', JSON.stringify(result));
                if (result.userId) {
                    localStorage.setItem('userId', result.userId);
                }

                message.style.color = '#4ade80';
                message.textContent = 'Login successful! Redirecting...';
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 1000);

            } catch (error) {
                message.style.color = '#f87171';
                message.textContent = 'Error: ' + error.message;
            } finally {
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
