<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SmartLocalServices</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #101827;
            color: #F5F3EE;
            font-family: Arial, sans-serif;
        }

        .register-box {
            width: 90%;
            max-width: 420px;
            padding: 30px;
            border-radius: 12px;
            background: #182235;
            box-sizing: border-box;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        h1 {
            color: #D9A441;
            text-align: center;
            margin-top: 0;
            font-size: 26px;
        }

        input, select, button {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border-radius: 6px;
            font-size: 15px;
        }

        input, select {
            border: 1px solid #526078;
            background: #F5F3EE;
            color: #101827;
        }

        button {
            border: none;
            background: #D9A441;
            color: #101827;
            font-weight: bold;
            cursor: pointer;
            margin-top: 14px;
            transition: background 0.2s;
        }

        button:hover {
            background: #e6b350;
        }

        a {
            color: #D9A441;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .links {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        #registerMessage {
            overflow-wrap: anywhere;
            text-align: center;
            min-height: 20px;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="register-box">
        <h1>🏡 Create Account</h1>
        <p style="text-align:center; color:#ccc; margin-top: -10px; font-size:14px;">SmartLocalServices Portal</p>

        <form id="registerForm">
            <input type="text" id="regName"
                   placeholder="Full Name" required>

            <input type="email" id="regEmail"
                   placeholder="Email Address" required>

            <input type="password" id="regPassword"
                   placeholder="Password" required>

            <input type="tel" id="regPhone"
                   placeholder="Phone Number" required>

            <select id="regRole" required>
                <option value="Customer">Customer</option>
                <option value="Provider">Service Provider</option>
            </select>

            <button type="submit" id="regButton">Register</button>
            <p id="registerMessage" role="status"></p>
        </form>

        <div class="links">
            <p>
                Already registered?
                <a href="login.html">Login here</a>
            </p>
            <p><a href="index.html">Back to Home</a></p>
        </div>
    </div>

    <script>
        const BACKEND_URL = 'https://sublime-delight-production-2c90.up.railway.app';

        document.getElementById('registerForm')
            .addEventListener('submit', async function(event) {
                event.preventDefault();

                const message = document.getElementById('registerMessage');
                const button = document.getElementById('regButton');

                message.style.color = '#F5F3EE';
                message.textContent = 'Registering...';
                button.disabled = true;

                const user = {
                    name: document.getElementById('regName').value.trim(),
                    email: document.getElementById('regEmail').value.trim(),
                    password: document.getElementById('regPassword').value,
                    phone: document.getElementById('regPhone').value.trim(),
                    role: document.getElementById('regRole').value
                };

                try {
                    const response = await fetch(BACKEND_URL + '/users/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        credentials: 'include',
                        body: JSON.stringify(user)
                    });

                    const result = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            result.message || 'Registration failed.'
                        );
                    }

                    if (result.id) {
                        localStorage.setItem('userId', result.id);
                        localStorage.setItem('currentUser', JSON.stringify(result));
                    }

                    message.style.color = '#4ade80';
                    message.textContent = 'Registration successful! Opening homepage...';

                    setTimeout(function() {
                        window.location.replace('index.html');
                    }, 1200);

                } catch (error) {
                    message.style.color = '#f87171';
                    message.textContent = error.message;
                } finally {
                    button.disabled = false;
                }
            });
    </script>
</body>
</html>
